<svg width="800" height="1000" viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#17181F"/>
      <stop offset="100%" stop-color="#08090D"/>
    </radialGradient>
    <radialGradient id="glow1" cx="30%" cy="60%" r="50%">
      <stop offset="0%" stop-color="#25F4EE" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#25F4EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#FE2C55" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FE2C55" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fig" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A2A1A"/>
      <stop offset="40%" stop-color="#2A1A0A"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>
  <rect width="800" height="1000" fill="url(#bg)"/>
  <rect width="800" height="1000" fill="url(#glow1)"/>
  <rect width="800" height="1000" fill="url(#glow2)"/>
  <!-- Silhouette body -->
  <ellipse cx="400" cy="650" rx="180" ry="300" fill="#1A1208"/>
  <!-- Head -->
  <ellipse cx="400" cy="320" rx="100" ry="115" fill="#2C1A0E"/>
  <!-- Neck -->
  <rect x="365" y="420" width="70" height="80" fill="#2C1A0E"/>
  <!-- Jacket -->
  <path d="M220 500 Q280 430 360 445 L360 700 L220 700 Z" fill="#0F0F14"/>
  <path d="M580 500 Q520 430 440 445 L440 700 L580 700 Z" fill="#0F0F14"/>
  <!-- Cyan jacket trim -->
  <path d="M360 445 L360 700" stroke="#25F4EE" stroke-width="2" opacity="0.6"/>
  <path d="M440 445 L440 700" stroke="#25F4EE" stroke-width="2" opacity="0.6"/>
  <!-- Chain / jewelry -->
  <ellipse cx="400" cy="490" rx="40" ry="8" fill="none" stroke="#F5B942" stroke-width="3" opacity="0.8"/>
  <!-- Highlight on face -->
  <ellipse cx="370" cy="290" rx="35" ry="40" fill="#3D2410" opacity="0.8"/>
  <!-- Eyes -->
  <ellipse cx="375" cy="305" rx="14" ry="10" fill="#0A0A0A"/>
  <ellipse cx="425" cy="305" rx="14" ry="10" fill="#0A0A0A"/>
  <ellipse cx="378" cy="303" rx="5" ry="5" fill="#FFF" opacity="0.9"/>
  <ellipse cx="428" cy="303" rx="5" ry="5" fill="#FFF" opacity="0.9"/>
  <!-- Cyan light streak -->
  <rect x="0" y="200" width="200" height="3" fill="#25F4EE" opacity="0.4" transform="rotate(-30 100 300)"/>
  <!-- Pink light streak -->
  <rect x="600" y="150" width="250" height="2" fill="#FE2C55" opacity="0.35" transform="rotate(15 700 200)"/>
  <!-- Stage floor reflection -->
  <ellipse cx="400" cy="950" rx="220" ry="40" fill="#25F4EE" opacity="0.08" filter="url(#blur)"/>
  <!-- Ambient particles -->
  <circle cx="150" cy="400" r="3" fill="#25F4EE" opacity="0.6"/>
  <circle cx="650" cy="250" r="2" fill="#FE2C55" opacity="0.7"/>
  <circle cx="700" cy="600" r="4" fill="#25F4EE" opacity="0.4"/>
  <circle cx="100" cy="700" r="2" fill="#FE2C55" opacity="0.5"/>
  <circle cx="600" cy="800" r="3" fill="#25F4EE" opacity="0.3"/>
</svg>
